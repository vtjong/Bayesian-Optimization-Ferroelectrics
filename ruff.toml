line-length = 100
extend-exclude = ["venv", "fla_ml_al_pipeline*", "data"]

lint.select = ["E", "F", "W", "I"]

[lint.per-file-ignores]
# thin entry-point scripts bootstrap sys.path before importing the package
"src/run_*.py" = ["E402"]
# tests import from src/ after conftest puts it on the path
"tests/*.py" = ["E402"]
# __init__.py deliberately re-exports package API
"**/__init__.py" = ["F401"]
